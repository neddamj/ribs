[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ribs"
version = "0.1.0"
description = "Reproducible experiments on robustness in information bottleneck systems"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "scikit-learn",
  "PyYAML",
  "torch",
  "torchvision",
  "safetensors",
  "matplotlib",
  "seaborn",
  "torchattacks==3.5.1",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
ribs = "ribs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
