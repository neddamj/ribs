record_type: runtime_amendment
date: 2026-09-17
status: frozen_before_restarting_postprocessing
supersedes_for_runtime_only: configs/phase2_decision_20260902T120000.yaml
results_already_inspected: true
rationale:
  - Phase 2 training is complete for all 69 registered runs.
  - The original postprocessing script unintentionally coupled the Phase 3 collision study to Phase 2.
  - Completed Phase 2 runs show small robustness effects, so training seeds are retained while the replicated strength grid is reduced.
  - Autoencoder reconstruction accuracy ranges from approximately 18 to 32 percent versus 89.7 percent on original images, making its robustness curves clean-accuracy-confounded.
  - Completed discrete collision evaluations found no exact collision in 1000 evaluated pairs per configuration and used only approximately 128 to 131 unique sources.
claim_boundary:
  - Phase 2 robustness claims cover dimensional, VIB, VQ, and scalar-quantized bottlenecks, not reconstruction bottlenecks.
  - Autoencoders remain a reconstruction and representation-geometry validation family.
  - Results under this amendment are transparently labeled as an amended confirmatory analysis because Phase 2 results were inspected before the reduction.
  - Phase 3 exact-collision results establish attack-found events only and are not evidence that collisions are impossible.
  - For stochastic VIB models, the epsilon-zero correctness check is internal to each attack evaluation; independently averaged finite-sample clean predictions need not match per sample.
