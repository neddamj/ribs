seed: 0
data:
  root: data/imagenette
  manifest: data/imagenette_manifest.csv
  size: 320px
  image_size: 224
  num_workers: 0
model:
  family: vq
  codebook_size: 128
  num_classes: 10
train:
  batch_size: 128
  effective_batch_size: 128
  epochs: 200
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 5
  minimum_learning_rate: 0.000001
  gradient_clip_norm: 5.0
  mixed_precision: auto
  label_smoothing: 0.0
attack:
  seed: 2025
  evaluation_batch_size: 32
  square_batch_size: 16
  collision_batch_size: 8
  run_diagnostics: true
  diagnostic_samples: 32
  diagnostic_tolerance: 0.02
  input_epsilons: [0.0, 0.00392156862745, 0.0078431372549, 0.0156862745098, 0.0313725490196, 0.0470588235294, 0.0627450980392]
  latent_rhos: [0.01, 0.02, 0.05, 0.10, 0.20, 0.30]
  steps: 40
  restarts: 5
  eot_samples: 1
  collision_steps: 200
  collision_restarts: 5
  collision_lambda_sem: 1.0
  collision_lambda_sem_tuned: false
output_dir: outputs
